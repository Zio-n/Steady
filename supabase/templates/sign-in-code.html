<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px;background:#f8f6ed;color:#153f35;font-family:Arial,sans-serif">
    <main style="max-width:480px;margin:0 auto;padding:32px;border:1px solid #d6ddcf;border-radius:18px;background:#fcfbf6">
      <p style="margin:0 0 18px;color:#637d35;font-size:13px;font-weight:700;letter-spacing:1px">STEADY</p>
      <h1 style="margin:0 0 12px;font-size:24px">Your sign-in code</h1>
      <p style="margin:0 0 24px;color:#586b60;line-height:1.6">Enter this code in Steady to securely sign in. It expires in one hour.</p>
      <p style="margin:0;padding:18px;border-radius:12px;background:#e9eddf;text-align:center;font-size:30px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
      <p style="margin:24px 0 0;color:#586b60;font-size:13px;line-height:1.6">If you didn’t request this code, you can safely ignore this email.</p>
    </main>
  </body>
</html>
